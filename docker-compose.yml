# Local infrastructure for development. Start: docker compose up -d   Reset data: docker compose down -v
# Each service gets its own database (database-per-service); see docker/postgres/init.sql.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app          # local-only credentials; real secrets never go in this repo
      POSTGRES_DB: payments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # runs only on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Week 3: add Kafka here (single-node KRaft broker, no ZooKeeper). Write this one yourself.

volumes:
  pgdata:
